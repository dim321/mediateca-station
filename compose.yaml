# Debug one station process against a local Broadcast Hub.
# The hub Compose project must already be up (service name: web, network
# mediateca_broadcast_default):
#
#   cd ../mediateca-broadcast && docker compose up
#
# Issue a token once in the hub (this replaces any previous token for that station):
#
#   docker compose exec web bin/rails runner 'puts Station.find(STATION_ID).assign_agent_token!'
#
# Then, in this repository:
#
#   cp .env.example .env    # AGENT_TOKEN and SCREEN_ID
#   docker compose up --build
#   docker compose logs -f station
#
# Two planes, same split as the location mini-PC:
#   eth0  television LAN  192.168.33.1/24   clips and ADB
#   eth1  administration  Hub Compose net   config, package, media download
# Docker attaches the Hub network first. The entrypoint renames the
# interfaces (CAP_NET_ADMIN) and keeps the default route on eth1.
# Hub polling uses the web container's IP on eth1. Development rejects
# Host: web. Leave HUB_BASE_URL unset.
#
# Clips are served only on http://192.168.33.1:8080 (eth0). The host reaches
# that address through the television bridge. Do not publish :8080: Docker
# would forward it to eth1, where nothing listens.
#
# Android TV emulator (needs /dev/kvm, about 3 GB of RAM, and a multi-GB
# image on first build). It is off unless the profile is selected:
#
#   docker compose --profile tv up --build
#
# The emulator is 192.168.33.182 on the television LAN. Station ADB is
# 192.168.33.182:5555. VLC opens http://192.168.33.1:8080/...
# Screen: scrcpy -s emulator-5554
# Host adb discovers the published port as an emulator, so the serial is
# emulator-5554, not 127.0.0.1:5555.

name: mediateca_station

services:
  tv:
    profiles: ["tv"]
    build:
      context: docker/tv
    devices:
      - /dev/kvm:/dev/kvm
    ports:
      - "5555:5555"
    environment:
      EMULATOR_MEMORY: ${EMULATOR_MEMORY:-2048}
      EMULATOR_CORES: ${EMULATOR_CORES:-2}
    mem_limit: 3g
    shm_size: 2gb
    networks:
      television:
        ipv4_address: 192.168.33.182
    healthcheck:
      test: ["CMD-SHELL", "adb shell pm path org.videolan.vlc | tr -d '\\r' | grep -q org.videolan.vlc"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 180s
    restart: unless-stopped

  station:
    build:
      context: .
      dockerfile: Dockerfile
    cap_add:
      - NET_ADMIN
    env_file:
      - path: .env
        required: false
    environment:
      AGENT_TOKEN: ${AGENT_TOKEN:-}
      SCREEN_ID: ${SCREEN_ID:-}
      ADB_SERIAL: ${ADB_SERIAL:-192.168.33.182:5555}
      HUB_BASE_URL: ${HUB_BASE_URL:-}
      HTTP_LISTEN: ${HTTP_LISTEN:-192.168.33.1:8080}
      HTTP_PUBLIC: ${HTTP_PUBLIC:-192.168.33.1:8080}
      HTTP_SECRET: ${HTTP_SECRET:-dev-only-http-secret-not-for-production}
      POLL_INTERVAL: ${POLL_INTERVAL:-15s}
      LATE_THRESHOLD: ${LATE_THRESHOLD:-2s}
      DATA_DIR: /var/lib/mediateca-station
    volumes:
      - station-data:/var/lib/mediateca-station
      # Full config instead of the variables above. Mode must be 0600.
      # - ./config.yaml:/etc/mediateca-station/config.yaml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      tv:
        condition: service_healthy
        required: false
    networks:
      television:
        ipv4_address: 192.168.33.1
        mac_address: "e8:ff:1e:dc:23:56"
      hub:
        mac_address: "d0:37:45:78:7e:61"
    restart: unless-stopped

networks:
  hub:
    name: mediateca_broadcast_default
    external: true
  television:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.33.0/24
          gateway: 192.168.33.254

volumes:
  station-data:
