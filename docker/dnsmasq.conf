# Lab stand-in for the mini-PC DHCP service. DNS stays off so this process
# cannot answer the administration plane. interface=eth0 exists only after
# align_station_nics renames the television NIC.
port=0
interface=eth0
bind-interfaces
except-interface=eth1
dhcp-authoritative
dhcp-range=192.168.33.100,192.168.33.180,255.255.255.0,12h
dhcp-option=option:router,192.168.33.1
dhcp-leasefile=/var/lib/misc/dnsmasq.leases
log-dhcp
